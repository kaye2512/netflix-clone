services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netflix-backend
    restart: unless-stopped
    expose:
      - '8000'
    environment:
      NODE_ENV: development
      MONGO_URI: ${MONGO_URI}
      SERVER_PORT: 8000
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}
      MAILTRAP_ENDPOINT: ${MAILTRAP_ENDPOINT}
      HTTPS: ${HTTPS:-false}
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netflix-frontend
    restart:
      unless-stopped
      # Override du CMD pour forcer allowedHosts
    command: ['bun', 'run', 'preview', '--', '--host', '0.0.0.0', '--port', '5173', '--strictPort']
    expose:
      - '5173'
    networks:
      - app-network
    depends_on:
      - backend
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  nginx:
    image: nginx:alpine
    container_name: netflix-nginx
    restart: unless-stopped
    ports:
      - '80:80' # seul nginx expose vers l'extérieur
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
   
  mongo:
    image: mongo
    container_name: netflix-db
    ports: 
     - '27017:27017'
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - db-data:/data/db
    networks:
      - app-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
  mongo-express:
    image: mongo-express
    container_name: netflix-mongo-express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_ENABLED: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
    depends_on:
      - mongo
    networks:
      - app-network        
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
        
volumes:
  db-data:

networks:
  app-network:
    driver: bridge
